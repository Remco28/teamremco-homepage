<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Team Remco projects: small apps made for a reason. Follow a spark through the brain, or browse the list." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0c12" />
  <title>Projects — Team Remco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" />
  <style>
/* One dark room: a quiet line-drawn brain, one spark at a time, the plain list below. Dark only, by choice. */
:root {
  --bg: #0a0c12;
  --panel: #121622;
  --ink: #ebe6da;
  --muted: #8b91a4;
  --rule: #222a3b;
  --spark: #ffcf6b;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-direction: column; gap: 10px; }
.crumb { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.crumb a { color: inherit; text-decoration: none; }
.crumb a:hover, .crumb a:focus-visible { color: var(--spark); }
h1 { font-weight: 400; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 52ch; }

.stage { position: relative; width: 100%; aspect-ratio: 1399 / 930; max-width: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#fx { cursor: pointer; touch-action: manipulation; }

.glow {
  position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px;
  border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.4);
  background: radial-gradient(circle, rgba(255, 220, 140, .5) 0, rgba(255, 190, 90, .16) 34%, rgba(255, 190, 90, 0) 68%);
  transition: opacity .6s ease, transform .9s cubic-bezier(.2, .7, .2, 1);
}
.glow::before { content: ""; position: absolute; inset: 46%; border-radius: 50%; background: #fff4d6; box-shadow: 0 0 10px 3px rgba(255, 207, 107, .8); }
.glow::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; border: 1px solid var(--spark); opacity: 0; }
.glow.on { opacity: 1; transform: scale(1); }
.glow.on::after { animation: ping 1.5s ease-out 1; }
@keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

.thought {
  position: absolute; left: 0; top: 0; width: max-content; max-width: min(280px, calc(100% - 8px));
  display: flex; flex-direction: column; gap: 10px; padding: 13px 15px 12px;
  background: rgba(15, 18, 28, .92); border: 1px solid rgba(255, 207, 107, .38); border-radius: 10px;
  color: var(--ink); text-decoration: none; box-shadow: 0 0 28px rgba(255, 190, 90, .1);
  opacity: 0; transform: translateY(5px); pointer-events: none;
  transition: opacity .45s ease, transform .45s ease, border-color .2s;
}
.thought.on { opacity: 1; transform: none; pointer-events: auto; }
.thought:hover, .thought:focus-visible { border-color: var(--spark); outline: none; }
.thought .line { font-style: italic; font-size: clamp(16px, 2.1vw, 19px); line-height: 1.32; text-wrap: pretty; }
.thought .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; color: var(--spark); display: flex; justify-content: space-between; gap: 14px; }

.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.controls button {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 999px; width: 40px; height: 40px; cursor: pointer; display: grid; place-items: center;
}
.controls button:hover:not(:disabled) { border-color: var(--spark); color: var(--spark); }
.controls button:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.controls button:disabled { opacity: .35; cursor: default; }
#count { min-width: 5ch; text-align: center; font-variant-numeric: tabular-nums; }
.hint { margin-left: auto; letter-spacing: .02em; }

.all { border-top: 1px solid var(--rule); padding-top: 26px; display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.all-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.all h2 { font-weight: 400; font-size: 24px; margin: 0; }
#q {
  font-family: var(--mono); font-size: 14px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; width: min(280px, 100%);
}
#q:focus-visible { outline: 2px solid var(--spark); outline-offset: 1px; }
#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
#list li { border-bottom: 1px solid var(--rule); }
#list a { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 2px; color: inherit; text-decoration: none; }
#list a:hover .t, #list a:focus-visible .t { color: var(--spark); }
#list a:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
#list .t { font-size: 18px; }
#list .b { color: var(--muted); font-size: 16px; line-height: 1.4; min-width: 0; }
#list .tags { grid-column: 2; font-family: var(--mono); font-size: 11px; color: #5f667a; letter-spacing: .04em; }
#none { color: var(--muted); font-style: italic; margin: 0; }
.note { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }

@media (max-width: 560px) {
  .stage { margin-bottom: 118px; }
  #list a { grid-template-columns: 1fr; }
  #list .tags { grid-column: 1; }
  .hint { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .glow, .thought { transition-duration: .01s; }
  .glow.on::after { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="/">teamremco.org</a><span>/ projects</span></div>
    <h1>Where the ideas come from</h1>
    <p class="lede">Each spark is one project. Tap the one that’s lit, or tap anywhere on the brain to send a spark somewhere new.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="base" aria-hidden="true"></canvas>
    <canvas id="fx" aria-label="Brain. Tap to send a spark somewhere new." role="img"></canvas>
    <div class="glow" id="glow"></div>
    <a class="thought" id="thought" aria-live="polite">
      <span class="line" id="tLine"></span>
      <span class="meta"><span id="tTitle"></span><span id="tVerb">open →</span></span>
    </a>
  </div>

  <div class="controls">
    <button type="button" id="prev" aria-label="Previous spark">←</button>
    <span id="count">1 / 1</span>
    <button type="button" id="next" aria-label="Next spark">→</button>
    <span class="hint">A new spark every few seconds. Hover a spark to hold it.</span>
  </div>

  <section class="all">
    <div class="all-head">
      <h2>Every project</h2>
      <input id="q" type="search" placeholder="search projects" aria-label="Search projects" autocomplete="off">
    </div>
    <ul id="list"></ul>
    <noscript><p class="note">The project list needs JavaScript. You can also type <code>ls</code> in the console on the <a href="/">homepage</a>.</p></noscript>
    <p id="none" hidden>Nothing matches that.</p>
  </section>

</div>
<script src="sparks.js" defer></script>
</body>
</html>

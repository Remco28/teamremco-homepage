  <style>
.not-found {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  align-items: center;
  gap: var(--tr-space-10);
  padding-block: var(--tr-space-10) var(--tr-space-16);
}
.not-found-text .tr-eyebrow {
  margin-bottom: var(--tr-space-2);
}
.not-found-text h1 {
  font-size: clamp(var(--tr-font-size-4xl), 5vw, var(--tr-font-size-5xl));
  line-height: var(--tr-line-height-5xl);
  margin-bottom: var(--tr-space-4);
}
.not-found-text .tr-lead {
  max-width: 28rem;
  margin-bottom: var(--tr-space-8);
}
.not-found-photo {
  margin: 0;
}
.not-found-photo img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: var(--tr-radius-2xl);
  box-shadow: 0 1px 2px var(--tr-paper-shadow-near), 0 10px 24px var(--tr-paper-shadow-far);
}

@media (max-width: 820px) {
  .not-found {
    grid-template-columns: 1fr;
    gap: var(--tr-space-6);
    padding-block: var(--tr-space-4) var(--tr-space-12);
  }
  .not-found-photo {
    order: -1;
    max-width: 30rem;
  }
}
  </style>
</head>
<body class="tr-grain">

          <img src="/assets/brand/photos/toppled-960.jpg" width="960" height="640"

               alt="Wooden blocks on a table: the green arch stands upright while the blue roof has tipped over onto its side in front of it." />
        </picture>
